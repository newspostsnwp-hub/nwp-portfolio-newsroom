name: Refresh portfolio news
run-name: Refresh portfolio news (${{ inputs.run_slot || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      run_slot:
        description: Which scheduled slot triggered this run
        required: false
        default: manual
        type: choice
        options:
          - manual
          - morning
          - afternoon
      send_digest:
        description: Send the email digest after updating news
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: portfolio-news-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Collect and publish portfolio news
    runs-on: ubuntu-latest
    # The 30-day lookback plus a cleared cache makes the first catch-up run the
    # slowest this job will ever be, so the budget and the timeout both allow
    # for it rather than silently truncating the analysis loop.
    timeout-minutes: 45

    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore discovery and evaluation caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: newsroom-cache-v2-${{ github.run_id }}
          restore-keys: |
            newsroom-cache-v2-

      - name: Collect news and generate drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          COMPANIES_HOUSE_KEY: ${{ secrets.COMPANIES_HOUSE_KEY }}
          LOOKBACK_DAYS: "30"
          FRESH_DAYS: "7"
          ANALYZE_PER_COMPANY: "6"
          MIN_SCORE: "45"
          LEAD_SCORE: "80"
          SOLID_SCORE: "60"
          RUN_BUDGET_SECONDS: "2400"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/update_news.py

      - name: Validate generated news data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          news_file = Path("site/data/news.json")

          if not news_file.exists():
              raise SystemExit("site/data/news.json was not created.")

          with news_file.open("r", encoding="utf-8") as file:
              data = json.load(file)

          required_fields = {"generated_at", "lookback_days", "story_count", "stories"}
          missing_fields = required_fields - set(data)

          if missing_fields:
              raise SystemExit(f"news.json is missing fields: {sorted(missing_fields)}")

          if not isinstance(data["stories"], list):
              raise SystemExit("The stories field must be a JSON list.")

          if data["story_count"] != len(data["stories"]):
              raise SystemExit("story_count does not match the number of stories.")

          summary = data.get("run_summary", {})
          print(f"Validated news.json with {data['story_count']} stories "
                f"across {summary.get('companies_with_stories', '?')} companies.")
          PY

      - name: Email the morning digest
        if: github.event.inputs.send_digest == 'true'
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: https://nwp-portfolio-newsroom.newspostsnwp.workers.dev/
          DIGEST_MAX: "6"
        shell: bash
        run: |
          python scripts/send_digest.py

      - name: Commit refreshed news data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "nwp-news-bot"
          git config user.email "actions@users.noreply.github.com"

          # --porcelain rather than `git diff`, because archive.json is untracked
          # on the very first run and `git diff` would not see it at all.
          if [ -z "$(git status --porcelain -- site/data/news.json site/data/archive.json config/companies.json)" ]; then
            echo "Nothing changed. Nothing to commit."
            exit 0
          fi

          # All three files are rewritten whole rather than edited hunk by hunk, so
          # they are set aside and replayed onto the latest main instead of
          # being merged.
          mkdir -p "$RUNNER_TEMP/out"
          cp site/data/news.json "$RUNNER_TEMP/out/news.json"
          cp config/companies.json "$RUNNER_TEMP/out/companies.json"
          # The archive write is best-effort in update_news.py, so a missing file
          # must not abort the publish and lose the news.json update with it.
          cp site/data/archive.json "$RUNNER_TEMP/out/archive.json" 2>/dev/null \
            || echo "No archive.json produced this run; publishing without it."

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt} of 3"

            git fetch origin main
            git reset --hard origin/main

            cp "$RUNNER_TEMP/out/news.json" site/data/news.json
            if [ -f "$RUNNER_TEMP/out/archive.json" ]; then
              cp "$RUNNER_TEMP/out/archive.json" site/data/archive.json
            fi

            # A company can be added or removed through the dashboard while this
            # run is in flight, so main decides which companies exist and this
            # run only contributes the researched fields for each one.
            python - "$RUNNER_TEMP/out/companies.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          researched = {}
          for entry in json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")):
              if isinstance(entry, dict) and entry.get("enriched_at"):
                  researched[entry.get("name")] = entry

          live_path = Path("config/companies.json")
          live = json.loads(live_path.read_text(encoding="utf-8"))

          applied = []
          for entry in live:
              mine = researched.get(entry.get("name"))
              if mine is None or entry.get("enriched_at"):
                  continue
              entry.update(mine)
              applied.append(entry["name"])

          if applied:
              live_path.write_text(json.dumps(live, ensure_ascii=False, indent=2) + "\n",
                                   encoding="utf-8")
          print(f"Company profiles applied: {applied or 'none'}")
          PY

            # The directory rather than the two filenames, so a run that produced
            # no archive.json does not abort here on a missing pathspec.
            git add site/data config/companies.json

            if git diff --cached --quiet; then
              echo "No changes left to publish."
              exit 0
            fi

            if git diff --cached --name-only | grep -qx 'config/companies.json'; then
              git commit -m "Refresh portfolio news and researched company profiles"
            else
              git commit -m "Refresh portfolio news"
            fi

            if git push origin HEAD:main; then
              echo "Refreshed news data pushed successfully."
              exit 0
            fi

            echo "The remote branch changed. Retrying shortly."
            sleep $((attempt * 3))
          done

          echo "Unable to push after three attempts."
          exit 1
